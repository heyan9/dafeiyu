name: 打包桌面版

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 写入网站地址（自动取你的 GitHub Pages 地址）
        shell: bash
        env:
          O: ${{ github.repository_owner }}
          R: ${{ github.event.repository.name }}
        run: |
          node -e "const f=require('./config.json'),o=process.env.O,r=process.env.R;f.url='https://'+o+'.github.io/'+(r.toLowerCase()===o.toLowerCase()+'.github.io'?'':r+'/');require('fs').writeFileSync('config.json',JSON.stringify(f,null,2));console.log(f)"
      - name: 把网页装进应用（国内不用访问 GitHub Pages）
        shell: bash
        run: |
          mkdir -p site
          cp ../index.html site/index.html
      - run: npm install
      - name: 打包 Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: 打包 Mac
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: "大肥鱼桌面版 #${{ github.run_number }}"
          make_latest: true
          files: out/*
