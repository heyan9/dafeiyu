<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
#o{position:absolute;inset:6px;border-radius:50%;cursor:pointer;transition:transform .5s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 6px 12px rgba(5,109,232,.38))}
#o:hover{transform:scale(1.1)}#o:active{transform:scale(.9)}
#i{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff;box-sizing:border-box;background:#EAF3FF;pointer-events:none;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-2px) rotate(-3deg)}}
.b #o::after{content:"";position:absolute;right:-2px;top:-2px;width:16px;height:16px;border-radius:50%;background:#F1475A;border:2px solid #fff;box-sizing:border-box;animation:pu 1.1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.3)}}
</style></head>
<body><div id="o"><img id="i" alt=""></div>
<script>
const WH="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' fill='%23EAF3FF'/%3E%3Cpath d='M46 26c0-7-5-10-4-16M53 26c1-6 6-7 8-13' stroke='%237DB4FF' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 56c0-18 14-30 33-30 12 0 22 6 27 15 5-1 9-5 11-11 1 9-3 16-9 20 0 17-14 28-31 28C27 78 12 70 12 56z' fill='%23056DE8'/%3E%3Cpath d='M20 62c7 10 20 14 34 11 10-2 16-7 19-13-13 6-34 5-53 2z' fill='%23CFE3FF'/%3E%3Ccircle cx='33' cy='50' r='3.6' fill='%23fff'/%3E%3Ccircle cx='33.8' cy='50' r='1.7' fill='%230B2A5B'/%3E%3Ccircle cx='27' cy='57' r='3.2' fill='%237DB4FF' opacity='.75'/%3E%3C/svg%3E";
const o=document.getElementById('o'),i=document.getElementById('i');
i.src=WH;
ui.cfg().then(c=>{if(c&&c.avatar)i.src=c.avatar}).catch(()=>{});
ui.onBadge(v=>document.body.classList.toggle('b',!!v));
o.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  o.setPointerCapture(e.pointerId);ui.drag('start');
  o.onpointermove=()=>ui.drag('move');
  o.onpointerup=()=>{o.onpointermove=o.onpointerup=null;ui.drag('end')};
});
addEventListener('contextmenu',e=>{e.preventDefault();ui.menu()});
</script></body></html>
